<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — MP3 Library</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #14151a; color: #e8e8ec;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  /* Tiled mosaic of random artist pictures and album covers, rotated behind the sign-in card —
     similar to the Jellyfin login screen. The tiles themselves are rendered straight into this
     page's HTML by the server (see server/loginPage.js) rather than fetched by client-side JS
     after the page loads, so the mosaic is already there on first paint instead of popping in a
     beat later. With no pictures yet (nothing scanned/matched), the .bg-mosaic div is simply
     empty and body's plain #14151a background shows through unchanged. */
  .bg-mosaic {
    position: fixed; inset: 0; z-index: 0; overflow: hidden; background: #14151a;
  }
  .bg-mosaic-grid {
    position: absolute; top: 50%; left: 50%; width: 150%; height: 150%;
    transform: translate(-50%, -50%) rotate(-8deg);
    display: grid; grid-template-columns: repeat(14, 1fr); grid-auto-rows: 1fr; gap: 2px;
  }
  .bg-mosaic-grid img {
    width: 100%; height: 100%; object-fit: cover; display: block;
    filter: saturate(0.85) brightness(0.8);
  }
  .bg-overlay {
    position: fixed; inset: 0; z-index: 1;
    background: radial-gradient(ellipse at center, rgba(20, 21, 26, 0.55) 0%, rgba(20, 21, 26, 0.88) 75%);
  }
  .card {
    position: relative; z-index: 2;
    background: rgba(29, 30, 37, 0.92); backdrop-filter: blur(6px);
    border: 1px solid #2b2c35; border-radius: 12px;
    padding: 40px 36px; width: 100%; max-width: 360px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
  }
  h1 { font-size: 1.3rem; margin: 0 0 6px; }
  p.sub { color: #9a9ba6; margin: 0 0 24px; font-size: 0.9rem; }
  label { display: block; font-size: 0.85rem; margin: 14px 0 6px; color: #c3c4ce; }
  input {
    width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #34353f;
    background: #14151a; color: #e8e8ec; font-size: 1rem;
  }
  input:focus { outline: 2px solid #5b7fff; }
  button {
    width: 100%; margin-top: 22px; padding: 11px; border-radius: 8px; border: none;
    background: #5b7fff; color: white; font-size: 1rem; font-weight: 600; cursor: pointer;
  }
  button:hover { background: #4a6bed; }
  .error { color: #ff6b6b; font-size: 0.85rem; margin-top: 12px; min-height: 1em; }
</style>
</head>
<body>
  <div class="bg-mosaic" id="bgMosaic"><!--MOSAIC_TILES--></div>
  <div class="bg-overlay"></div>
  <form class="card" id="loginForm">
    <h1>MP3 Library</h1>
    <p class="sub">Sign in to browse your collection.</p>
    <label for="username">Username</label>
    <input type="text" id="username" name="username" autocomplete="username" required autofocus>
    <label for="password">Password</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
    <div class="error" id="error"></div>
  </form>

<script>
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    const errorEl = document.getElementById('error');
    errorEl.textContent = '';
    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });
      if (res.ok) {
        window.location.href = '/';
      } else {
        const data = await res.json().catch(() => ({}));
        errorEl.textContent = data.error || 'Sign in failed.';
      }
    } catch {
      errorEl.textContent = 'Could not reach the server.';
    }
  });
</script>
</body>
</html>
