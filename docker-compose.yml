services:
  mp3-library:
    image: mp3-library
    environment:
      PORT: 3000
      MUSIC_DIR: ${MUSIC_DIR}
      ARTIST_PICTURES_DIR: ${ARTIST_PICTURES_DIR}
      DATA_DIR: ${DATA_DIR}
      APP_USERNAME: ${APP_USERNAME}
      APP_PASSWORD: ${APP_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
      # Optional — powers the Last.fm "About" section on the Artist Info tab and the Radio
      # (📻 similar-tracks queue) feature. Free key from https://www.last.fm/api/account/create.
      # Leave unset to skip that section (Radio still works via a same-genre/same-artist fallback).
      LASTFM_API_KEY: ${LASTFM_API_KEY}
      # Required only if you also want scrobbling (connect your account from Settings in the
      # app) — the "Shared secret" from the same Last.fm API account page.
      LASTFM_API_SECRET: ${LASTFM_API_SECRET}
    volumes:
      # These read the HOST-side paths straight from your .env file (MUSIC_HOST_DIR_1 etc.) —
      # edit .env, not this file. Read-only is enough — the app never writes here.
      # Only one music folder? Delete the MUSIC_HOST_DIR_2 line below AND drop
      # ",/music/collection2" from MUSIC_DIR in your .env.
      - ${CONFIGS}/mp3-library:/data
      - ${MUSIC_HOST_DIR_1}:/music/collection1:ro
      - ${MUSIC_HOST_DIR_2}:/music/collection2:ro
      - ${ARTIST_PICTURES_HOST_DIR}:/artist-pictures:ro"
      # Persistent database + covers cache — kept alongside your other services' config.
    ports:
      - "${PORT}:3000"
    restart: unless-stopped
